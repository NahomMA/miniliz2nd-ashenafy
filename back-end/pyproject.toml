[project]
name = "rightsize-api"
version = "0.1.0"
description = "Life insurance needs analyzer: Flask API, MCP calculator, Amazon Bedrock chat"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "boto3>=1.40",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=22.0",
    "mcp>=1.12,<2",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
